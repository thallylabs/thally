# Promote the current starter + runtime mains into a new immutable scaffold
# release record (launch-readiness 1-F, first slice).
#
# One dispatch computes the record from the live heads, verifies the starter's
# runtime pin actually matches the runtime commit being promoted, and opens a
# reviewable PR carrying the new stable-scaffold-release.json, the retained
# previous record, and the three package patch bumps. It deliberately merges
# nothing and publishes nothing: npm publish stays in publish-packages.yml
# (dispatched manually after this PR merges), and the thally-cloud vendoring +
# baseline rebuild + scaffold:promote remain explicit operator steps.
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests"; no secret beyond the workflow's own GITHUB_TOKEN is used.

name: Promote release

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: >-
          thally runtime commit to promote. Leave empty to use the current
          main head. Must match the runtime pin in the starter's
          starter-release.json.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # Labels live on the Issues API; needed to ensure `release-promotion` exists.
  issues: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require protected main
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatches
        run: test "$GITHUB_REF" = refs/heads/main

  promote:
    name: Compute record · Open PR
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Compute the new scaffold release record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SHA_INPUT: ${{ inputs.runtime_sha }}
        run: node .github/scripts/compute-scaffold-release.mjs

      - name: Bump package patch versions
        run: |
          for pkg in create-thally-docs mcp cli; do
            (cd "packages/$pkg" && npm version patch --no-git-tag-version)
          done

      - name: Open the release-record PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.record.outputs.release_id }}
          STARTER_SHA: ${{ steps.record.outputs.starter_sha }}
          RUNTIME_SHA: ${{ steps.record.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          branch="release/promote-${RELEASE_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add \
            packages/create-thally-docs/src/stable-scaffold-release.json \
            packages/create-thally-docs/src/previous-scaffold-releases.json \
            packages/create-thally-docs/package.json \
            packages/mcp/package.json \
            packages/cli/package.json
          git commit -m "release: promote scaffold release ${RELEASE_ID}"
          git push -u origin "$branch"

          # Idempotently ensure the label exists before referencing it.
          gh label create release-promotion \
            --color 0E8A16 \
            --description "Scaffold release promotion record" \
            --force

          cat > /tmp/promote-pr-body.md <<EOF
          ## Scaffold release promotion

          | Field | Value |
          | --- | --- |
          | Release id | \`${RELEASE_ID}\` |
          | Starter commit | \`${STARTER_SHA}\` |
          | Runtime commit | \`${RUNTIME_SHA}\` |

          Generated by the **Promote release** workflow from the current
          \`thallylabs/starter\` and \`thallylabs/thally\` mains. The starter's
          \`starter-release.json\` runtime pin was verified against the runtime
          commit above before this record was written.

          ## Remaining manual steps (in order)

          1. Merge this PR.
          2. Dispatch the **Publish packages** workflow (\`publish-packages.yml\`)
             on \`main\` to publish the three bumped packages to npm.
          3. Merge the \`thally-cloud\` vendoring PR for this record (the builder
             image deploys on that merge).
          4. Rebuild the baseline site ("Publish again"), then run
             \`npm run scaffold:promote -- <managed release id>\`.

          Nothing is auto-merged or auto-published by this workflow.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --label release-promotion \
            --title "release: promote scaffold release ${RELEASE_ID}" \
            --body-file /tmp/promote-pr-body.md
