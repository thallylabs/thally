# Promote the current starter + runtime mains into a new immutable scaffold
# release record (launch-readiness 1-F, first slice).
#
# One dispatch computes the record from the live heads, verifies the starter's
# runtime pin actually matches the runtime commit being promoted, and opens a
# reviewable PR carrying the new stable-scaffold-release.json, the retained
# previous record, and dependency-aware package patch bumps. Manual dispatches
# leave the pull request for review; the full-release controller may merge only
# after the exact head and base pass CI. The main merge starts
# publish-packages.yml; only after npm verification succeeds does that workflow
# hand the immutable record locator to Thally Cloud.
#
# The full-release controller may start this workflow while the starter's own
# CI is still verifying the selected starter commit, so the two checks overlap.
# In that case only, the starter commit may be the head of the open starter
# synchronization pull request instead of a commit on starter main. The record
# is still never merged for an unverified starter: the merge step waits until
# that exact commit is on starter main, which the starter workflow allows only
# after its CI passes. A controller promotion that fails or is cancelled
# closes its record pull request, so a record for a starter commit that never
# landed cannot be merged by hand; the next dispatch opens a fresh one.
# Manual dispatches always require a commit already on starter main.
#
# Repository writes use a short-lived GitHub App token narrowed to Actions
# read, Contents/Pull requests write, and Issues write for the release label.
# Its private key is available only through the main-restricted
# `release-control` environment shared with the one-click controller.

name: Promote release

run-name: >-
  Promote release${{ inputs.request_id && format(' · {0}', inputs.request_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: >-
          thally runtime commit to promote. Leave empty to use the current
          main head. Must match the runtime pin in the starter's
          starter-release.json.
        required: false
        type: string
      starter_sha:
        description: >-
          Exact starter main commit to bind. Leave empty only for manual
          recovery against the current starter main.
        required: false
        type: string
      release_base_sha:
        description: Exact thally main commit whose package tree is promoted
        required: false
        type: string
      auto_merge:
        description: Merge the generated release PR after CI succeeds
        required: false
        default: false
        type: boolean
      request_id:
        description: Release-controller correlation id
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  guard:
    name: Require protected main
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatches
        run: test "$GITHUB_REF" = refs/heads/main

  promote:
    name: Compute record · Open PR
    needs: guard
    runs-on: ubuntu-latest
    environment: release-control
    steps:
      - name: Mint the destination PR token
        id: pr-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_COORDINATOR_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_COORDINATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thally
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.pr-bot.outputs.token }}

      - name: Checkout the current starter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: thallylabs/starter
          ref: ${{ inputs.starter_sha || 'main' }}
          path: starter-source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the selected runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.runtime_sha || github.sha }}
          path: runtime-source
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the selected sources are on main
        id: sources
        shell: bash
        env:
          # True only for the controller's merging dispatch; a manual dispatch
          # can never bind a starter commit that is not yet on starter main.
          ALLOW_PENDING_STARTER: ${{ inputs.auto_merge && github.actor == vars.RELEASE_COORDINATOR_ACTOR }}
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_BASE_SHA: ${{ inputs.release_base_sha }}
          RUNTIME_SHA_INPUT: ${{ inputs.runtime_sha }}
          STARTER_SHA_INPUT: ${{ inputs.starter_sha }}
          # The starter is public; this token only reads its pull requests.
          STARTER_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUEST_ID" && ! "$REQUEST_ID" =~ ^[a-zA-Z0-9._-]{1,80}$ ]]; then
            echo "::error::request_id must contain only letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          if [[ -n "$STARTER_SHA_INPUT" && ! "$STARTER_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::starter_sha must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ -n "$RUNTIME_SHA_INPUT" && ! "$RUNTIME_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::runtime_sha must be a full lowercase commit SHA."
            exit 1
          fi
          selected_release_base="$(git rev-parse HEAD)"
          if [[ -n "$RELEASE_BASE_SHA" && "$RELEASE_BASE_SHA" != "$selected_release_base" ]]; then
            echo "::error::The release checkout does not match the controller's frozen package source."
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$selected_release_base" ]]; then
            echo "::error::thally main changed before the release promotion was prepared."
            exit 1
          fi
          git -C starter-source fetch --no-tags origin main
          git -C runtime-source fetch --no-tags origin main
          selected_sha="$(git -C starter-source rev-parse HEAD)"
          selected_runtime_sha="$(git -C runtime-source rev-parse HEAD)"
          git -C runtime-source merge-base --is-ancestor "$selected_runtime_sha" origin/main
          starter_pending_pr=""
          if ! git -C starter-source merge-base --is-ancestor "$selected_sha" origin/main; then
            if [[ "$ALLOW_PENDING_STARTER" != "true" || -z "$STARTER_SHA_INPUT" ]]; then
              echo "::error::Starter commit $selected_sha is not on starter main."
              exit 1
            fi
            # The controller selected a commit whose starter CI is still
            # running. Accept it only as the current head of the open
            # synchronization pull request for this runtime, one commit on
            # top of starter main. The merge step below still refuses to
            # merge until this commit is on starter main.
            sync_branch="automation/runtime-${selected_runtime_sha:0:12}"
            starter_pending_pr="$(
              GH_TOKEN="$STARTER_READ_TOKEN" gh api \
                "repos/thallylabs/starter/pulls?state=open&base=main&head=thallylabs:${sync_branch}&per_page=100" \
                | jq -r \
                  --arg branch "$sync_branch" \
                  --arg sha "$selected_sha" \
                  '.[] | select(.head.repo.full_name == "thallylabs/starter" and .head.ref == $branch and .head.sha == $sha) | .number' \
                | head -n 1
            )"
            if [[ -z "$starter_pending_pr" ]]; then
              echo "::error::Starter commit $selected_sha is neither on starter main nor the head of the open synchronization pull request for $sync_branch. If the starter merged that pull request by squash, run Full release again to bind the merged starter main."
              exit 1
            fi
            pending_parents="$(git -C starter-source rev-list --parents -n 1 "$selected_sha" | cut -d' ' -f2-)"
            if [[ "$pending_parents" != "$(git -C starter-source rev-parse origin/main)" ]]; then
              echo "::error::Starter commit $selected_sha is not a single commit on top of starter main."
              exit 1
            fi
            echo "Starter commit $selected_sha is pending in starter pull request #$starter_pending_pr."
          fi
          if [[ -n "$STARTER_SHA_INPUT" && "$selected_sha" != "$STARTER_SHA_INPUT" ]]; then
            echo "::error::The starter checkout does not match starter_sha."
            exit 1
          fi
          if [[ -n "$RUNTIME_SHA_INPUT" && "$selected_runtime_sha" != "$RUNTIME_SHA_INPUT" ]]; then
            echo "::error::The runtime checkout does not match runtime_sha."
            exit 1
          fi
          echo "starter_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "starter_pending_pr=$starter_pending_pr" >> "$GITHUB_OUTPUT"
          echo "runtime_sha=$selected_runtime_sha" >> "$GITHUB_OUTPUT"
          echo "release_base_sha=$selected_release_base" >> "$GITHUB_OUTPUT"

      - name: Prove starter runtime parity
        run: >-
          node .github/scripts/starter-runtime-contract.mjs check
          --starter-dir starter-source
          --runtime-dir runtime-source

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Freeze outgoing stable upgrade baseline
        run: cp packages/create-thally-docs/src/stable-scaffold-release.json "$RUNNER_TEMP/outgoing-scaffold-release.json"

      - name: Compute the new scaffold release record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SHA_INPUT: ${{ steps.sources.outputs.runtime_sha }}
          STARTER_SHA_INPUT: ${{ steps.sources.outputs.starter_sha }}
        run: node .github/scripts/compute-scaffold-release.mjs

      - name: Bump package patch versions
        run: |
          node .github/scripts/bump-release-packages.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # A candidate must upgrade existing customers before its record reaches
      # main or npm. This gate also covers manual promotion and full-release.
      - name: Install historical upgrade gate dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify complete historical scaffold upgrades
        run: >-
          npx tsx .github/scripts/verify-scaffold-upgrades.mts
          packages/create-thally-docs/src/stable-scaffold-release.json
          starter-source
          packages/create-thally-docs/src/previous-scaffold-releases.json
          "$RUNNER_TEMP/outgoing-scaffold-release.json"

      - name: Open the release-record PR
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.pr-bot.outputs.token }}
          RELEASE_ID: ${{ steps.record.outputs.release_id }}
          STARTER_SHA: ${{ steps.record.outputs.starter_sha }}
          RUNTIME_SHA: ${{ steps.record.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          branch="release/promote-${RELEASE_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            package-lock.json \
            packages/create-thally-docs/src/stable-scaffold-release.json \
            packages/create-thally-docs/src/previous-scaffold-releases.json \
            packages/*/package.json
          git commit -m "release: promote scaffold release ${RELEASE_ID}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            if [[ "$(git rev-parse HEAD^{tree})" != "$(git rev-parse FETCH_HEAD^{tree})" ]]; then
              echo "::error::Existing release branch $branch contains different bytes."
              exit 1
            fi
          else
            git push -u origin "$branch"
          fi

          # Idempotently ensure the label exists before referencing it.
          gh label create release-promotion \
            --color 0E8A16 \
            --description "Scaffold release promotion record" \
            --force

          cat > /tmp/promote-pr-body.md <<EOF
          ## Scaffold release promotion

          | Field | Value |
          | --- | --- |
          | Release id | \`${RELEASE_ID}\` |
          | Starter commit | \`${STARTER_SHA}\` |
          | Runtime commit | \`${RUNTIME_SHA}\` |

          Generated by the **Promote release** workflow from the current
          \`thallylabs/starter\` and \`thallylabs/thally\` mains. The starter's
          \`starter-release.json\` runtime pin was verified against the runtime
          commit above before this record was written.

          ## Release gate and automated tail

          The full-release controller merges this PR only after CI verifies the
          exact head against an unchanged \`main\` base. A manual promotion leaves
          it open for maintainer review. Either merge automatically starts
          **Publish packages**, which tests, publishes, verifies every registry
          artifact, then dispatches this immutable record to \`thally-cloud\` for
          its baseline rebuild, probes, and promotion gates. Manual **Publish
          packages** dispatch remains an idempotent recovery path.
          EOF

          # Reuse only an OPEN pull request from this repository. A release
          # id is stable for a UTC day, so a re-dispatch after a failed
          # attempt computes the same branch; the earlier attempt's closed
          # pull request must not be mistaken for this one, or the merge step
          # would wait on a pull request that can never merge.
          open_pull_request() {
            gh pr list \
              --head "$branch" \
              --base main \
              --state open \
              --json number,url,isCrossRepository \
              --jq 'map(select(.isCrossRepository == false)) | .[0] // empty'
          }
          pr_json="$(open_pull_request)"
          if [[ -z "$pr_json" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --label release-promotion \
              --title "release: promote scaffold release ${RELEASE_ID}" \
              --body-file /tmp/promote-pr-body.md
            # The listing can trail the creation by a moment.
            for attempt in {1..10}; do
              pr_json="$(open_pull_request)"
              [[ -n "$pr_json" ]] && break
              sleep 3
            done
          fi
          pr_url="$(jq -r .url <<<"$pr_json")"
          pr_number="$(jq -r .number <<<"$pr_json")"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::No open release-record pull request exists for $branch."
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "$pr_url"

      - name: Merge after CI succeeds
        if: >-
          inputs.auto_merge &&
          github.actor == vars.RELEASE_COORDINATOR_ACTOR
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ steps.sources.outputs.release_base_sha }}
          GH_TOKEN: ${{ steps.pr-bot.outputs.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          STARTER_PENDING_PR: ${{ steps.sources.outputs.starter_pending_pr }}
          STARTER_READ_TOKEN: ${{ github.token }}
          STARTER_SHA: ${{ steps.sources.outputs.starter_sha }}
        run: |
          set -euo pipefail
          # True only when a fresh fetch of starter main contains the commit
          # this record binds. Any fetch or ancestry failure counts as false.
          starter_is_on_main() {
            git -C starter-source fetch --no-tags --quiet origin main &&
              git -C starter-source merge-base --is-ancestor "$STARTER_SHA" FETCH_HEAD
          }
          pr_identity="$(gh pr view "$PR_NUMBER" --json baseRefOid,headRefOid)"
          base_sha="$(jq -r .baseRefOid <<<"$pr_identity")"
          head_sha="$(jq -r .headRefOid <<<"$pr_identity")"
          if [[ "$base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::thally main advanced before CI was bound to the release PR."
            exit 1
          fi
          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list \
                --workflow ci.yml \
                --event pull_request \
                --limit 50 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" \
                | head -n 1
            )"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::CI did not start for pull request #$PR_NUMBER."
            exit 1
          fi
          gh run watch "$run_id" --exit-status

          # Starter gate. The record binds an exact starter commit, and that
          # commit reaches starter main only after starter CI verified it.
          # Starter CI can finish after this repository's record CI, so wait
          # for it, but never merge without it. The starter advances main by
          # fast-forward; a squash merge would publish a different commit and
          # this gate would then fail instead of binding unverified bytes.
          starter_landed=false
          for attempt in {1..120}; do
            if starter_is_on_main; then
              starter_landed=true
              break
            fi
            if [[ -n "$STARTER_PENDING_PR" ]]; then
              starter_pr="$(
                GH_TOKEN="$STARTER_READ_TOKEN" gh api \
                  "repos/thallylabs/starter/pulls/$STARTER_PENDING_PR" \
                  --jq '[.state, .head.sha] | @tsv'
              )" || starter_pr=""
              starter_pr_state="$(cut -f1 <<<"$starter_pr")"
              starter_pr_head="$(cut -f2 <<<"$starter_pr")"
              if [[ -n "$starter_pr_head" && "$starter_pr_head" != "$STARTER_SHA" ]]; then
                echo "::error::Starter pull request #$STARTER_PENDING_PR now points at $starter_pr_head; the record for $STARTER_SHA is superseded and was not merged."
                exit 1
              fi
              if [[ "$starter_pr_state" == "closed" ]]; then
                # main is updated before the pull request closes; look again.
                if starter_is_on_main; then
                  starter_landed=true
                  break
                fi
                echo "::error::Starter pull request #$STARTER_PENDING_PR closed without starter main fast-forwarding to $STARTER_SHA, so the release record was not merged. The starter's Sync Thally runtime workflow must advance main by fast-forward to the commit its CI verified (a squash merge creates a different commit); deploy that starter workflow before this one. Run Full release again to bind the current starter main."
                exit 1
              fi
            fi
            sleep 10
          done
          if [[ "$starter_landed" != "true" ]]; then
            echo "::error::Starter commit $STARTER_SHA did not reach starter main within 20 minutes. Its CI has not passed, so the release record was not merged."
            exit 1
          fi

          current_base="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          final_base="$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)"
          if [[ "$current_base" != "$EXPECTED_BASE_SHA" || "$final_base" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::main advanced after CI; rerun promotion against the new base."
            exit 1
          fi
          # Hard gate, re-proved from a fresh fetch immediately before merging.
          if ! starter_is_on_main; then
            echo "::error::Starter commit $STARTER_SHA is not on starter main; refusing to merge the release record."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"

      # A controller promotion that did not merge must not leave its record
      # pull request open. The record may bind a starter commit that never
      # reached starter main, and left open it could be merged by hand and
      # publish a scaffold bound to unverified bytes. This step does not try
      # to prove whether the starter commit landed: closing is the safe
      # outcome either way, and the next Full release dispatch pushes the
      # branch again and opens a fresh pull request with a fresh CI run. It
      # finds the pull request by branch, so it also covers a failure between
      # pushing the branch and recording the pull request number.
      - name: Close an unmerged release record after a failed promotion
        if: >-
          (failure() || cancelled()) &&
          inputs.auto_merge &&
          github.actor == vars.RELEASE_COORDINATOR_ACTOR &&
          steps.record.outputs.release_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.pr-bot.outputs.token }}
          RELEASE_ID: ${{ steps.record.outputs.release_id }}
          STARTER_SHA: ${{ steps.sources.outputs.starter_sha }}
        run: |
          set -euo pipefail
          branch="release/promote-${RELEASE_ID}"
          if [[ ! "$branch" =~ ^release/promote-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9a-f]{8}\.[0-9a-f]{8}$ ]]; then
            echo "::error::Refusing to clean up unexpected branch name $branch."
            exit 1
          fi
          # A merged pull request is not open and is left alone, as is the
          # branch its merge already deleted.
          failed=false
          if ! open_numbers="$(
            gh pr list \
              --head "$branch" \
              --base main \
              --state open \
              --json number,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | .number'
          )"; then
            echo "::error::Could not list pull requests for $branch; deleting the branch so GitHub closes any open one."
            open_numbers=""
            failed=true
          fi
          for number in $open_numbers; do
            if gh pr close "$number" \
              --comment "Closed automatically: this promotion did not complete, so its release record (starter commit \`$STARTER_SHA\`) must not be merged. Run **Full release** again to open a fresh record pull request."; then
              echo "Closed release-record pull request #$number."
            else
              echo "::error::Could not close release-record pull request #$number; deleting its branch closes it instead."
              failed=true
            fi
          done
          # Deleting the head branch also closes any pull request still open
          # from it, so this runs even when the calls above failed. It is
          # skipped only when the record is known to have merged.
          merged_count="$(
            gh pr list --head "$branch" --base main --state merged --json number --jq length
          )" || merged_count="unknown"
          if [[ "$merged_count" == "0" || "$merged_count" == "unknown" ]] &&
             git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "::error::Could not delete $branch; delete it and close its pull request by hand."
              failed=true
            fi
          fi
          [[ "$failed" == "false" ]]
