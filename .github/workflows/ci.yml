name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Wrangler 4.111+ requires Node 22 for the exact dry-run package gate.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require a release disposition for changed packages
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node .github/scripts/release-package-plan.mjs --base "$BASE_SHA" --output "$RUNNER_TEMP/package-plan.json"

      - name: Test
        run: npm test

      # Reuse the workspace CLI built by `npm test`; a separate workflow used
      # to repeat checkout and tool installation for the same candidate.
      - name: Check authored content
        run: node packages/cli/dist/index.js check --ci .

      - name: Test release handoff boundary
        run: node --test .github/scripts/*.test.mjs

      - name: Build and enforce managed Worker size
        run: npm run build:cloudflare
        env:
          # Keep the build deterministic and offline — embeddings fall back to the
          # local hash provider when no key is present.
          THALLY_SITE_URL: https://example.com
