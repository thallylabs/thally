name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4.111+ requires Node 22 for the exact dry-run package gate.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test release handoff boundary
        run: node --test .github/scripts/*.test.mjs

      - name: Build and enforce managed Worker size
        run: npm run build:cloudflare
        env:
          # Keep the build deterministic and offline — embeddings fall back to the
          # local hash provider when no key is present.
          THALLY_SITE_URL: https://example.com
