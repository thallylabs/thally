# One operator dispatch drives the complete public release in two stages.
#
# Stage 1 (`release`, the blocking stage) synchronizes the standalone starter
# and merges an immutable release record. The starter synchronization and the
# record promotion overlap: the starter workflow advances its `main` by
# fast-forward to the commit its CI verifies, so that commit's SHA is known as
# soon as the synchronization pull request opens and the record can be
# prepared and checked while starter CI is still running. Nothing is merged
# early. The record merges only after its own CI passes and the selected
# starter commit is on starter `main`, and this stage succeeds only after the
# starter synchronization run itself succeeds.
#
# Stage 2 (`publication`, the asynchronous tail) starts once the record is on
# `main`. It waits for npm publication and verification, then for Thally Cloud
# to promote the exact scaffold. A failure there fails this workflow run.
#
# Destination workflows retain their own validation and recovery entrypoints;
# this controller only coordinates fixed workflows on protected main.

name: Full release

run-name: Full release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-public-release
  cancel-in-progress: false

jobs:
  release:
    name: Sync · Promote · Merge record
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This no-review environment is restricted to main. It prevents a workflow
    # revision on another branch from receiving the coordinator App key while
    # keeping the dispatch itself as the single operator authorization.
    environment: release-control
    # Only identifiers cross to the tail job. Tokens never do: each job mints
    # its own, and step outputs are scoped to the job that produced them.
    outputs:
      needed: ${{ steps.stable.outputs.needed }}
      cloud_complete: ${{ steps.stable.outputs.cloud_complete }}
      record_sha: ${{ steps.active-release.outputs.record_sha }}
      release_id: ${{ steps.active-release.outputs.release_id }}
      new_release_id: ${{ steps.published.outputs.release_id }}
      existing_release_id: ${{ steps.stable.outputs.release_id }}
      request_id: ${{ steps.release.outputs.request_id }}
      runtime_sha: ${{ steps.release.outputs.runtime_sha }}
      starter_sha: ${{ steps.release.outputs.stable_starter_sha || steps.starter.outputs.starter_sha }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Reject non-main dispatches
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Mint the release coordinator token
        id: coordinator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_COORDINATOR_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_COORDINATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            thally
            starter
            thally-cloud
          permission-actions: write
          permission-contents: read

      - name: Detect an already-stable release before selecting new work
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
        run: |
          set -euo pipefail
          runtime_head="$(gh api repos/thallylabs/thally/commits/main --jq .sha)"
          starter_head="$(gh api repos/thallylabs/starter/commits/main --jq .sha)"
          record="$(
            gh api 'repos/thallylabs/thally/contents/packages/create-thally-docs/src/stable-scaffold-release.json?ref=main' --jq .content \
              | tr -d '\n' \
              | base64 --decode
          )"
          release_id="$(jq -r .id <<<"$record")"
          record_sha=""
          while read -r candidate_sha; do
            candidate_id="$(
              gh api "repos/thallylabs/thally/contents/packages/create-thally-docs/src/stable-scaffold-release.json?ref=$candidate_sha" --jq .content \
                | tr -d '\n' \
                | base64 --decode \
                | jq -r .id
            )"
            if [[ "$candidate_id" == "$release_id" ]]; then
              record_sha="$candidate_sha"
              break
            fi
          done < <(
            gh api \
              'repos/thallylabs/thally/commits?path=packages/create-thally-docs/src/stable-scaffold-release.json&sha=main&per_page=100' \
              --jq '.[].sha'
          )
          if [[ -z "$record_sha" ]]; then
            echo "::error::The current stable release-record commit could not be resolved."
            exit 1
          fi

          if [[ "$runtime_head" == "$record_sha" && \
                "$starter_head" == "$(jq -r .source.commitSha <<<"$record")" ]]; then
            echo "current_stable=true" >> "$GITHUB_OUTPUT"
            echo "runtime_sha=$(jq -r .runtime.commitSha <<<"$record")" >> "$GITHUB_OUTPUT"
            echo "stable_starter_sha=$starter_head" >> "$GITHUB_OUTPUT"
          else
            echo "current_stable=false" >> "$GITHUB_OUTPUT"
            echo "runtime_sha=$runtime_head" >> "$GITHUB_OUTPUT"
          fi
          request_id="full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

      # Dispatch the starter synchronization and wait only until it has opened
      # (or found unnecessary) its pull request. Its CI and merge continue in
      # the background and are required to succeed further down.
      - name: Start the standalone starter synchronization
        if: steps.release.outputs.current_stable != 'true'
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
        run: |
          set -euo pipefail
          gh workflow run sync-runtime.yml \
            --repo thallylabs/starter \
            --ref main \
            -f runtime_ref="$RUNTIME_SHA" \
            -f auto_merge=true \
            -f request_id="$REQUEST_ID"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list \
                --repo thallylabs/starter \
                --workflow sync-runtime.yml \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle | contains(\"$REQUEST_ID\")) | .databaseId" \
                | head -n 1
            )" || run_id=""
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::The starter synchronization run did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          # The starter workflow keeps this step name stable for this poll.
          pr_step=""
          for attempt in {1..180}; do
            run_json="$(
              gh run view "$run_id" --repo thallylabs/starter --json status,conclusion,jobs
            )" || run_json='{}'
            pr_step="$(
              jq -r '[.jobs[]?.steps[]? | select(.name == "Open synchronization pull request" and .status == "completed")][0].conclusion // ""' <<<"$run_json"
            )"
            [[ -n "$pr_step" ]] && break
            if [[ "$(jq -r '.status // ""' <<<"$run_json")" == "completed" ]]; then
              echo "::error::Starter synchronization run $run_id ended ($(jq -r '.conclusion // "unknown"' <<<"$run_json")) before opening its pull request."
              exit 1
            fi
            sleep 5
          done
          if [[ "$pr_step" != "success" ]]; then
            echo "::error::Starter synchronization run $run_id did not open its pull request (step result: ${pr_step:-timed out})."
            exit 1
          fi

      # The selection is frozen before starter CI finishes. That is safe
      # because promote-release.yml merges the record only once this exact
      # commit is on starter main, and this job requires the synchronization
      # run to succeed before it reports the record as merged.
      - name: Freeze and verify the starter selection
        if: steps.release.outputs.current_stable != 'true'
        id: starter
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          SYNC_RUN_ID: ${{ steps.sync.outputs.run_id }}
        run: |
          set -euo pipefail
          # The synchronization run's merge step is skipped exactly when the
          # starter already matched the runtime, and runs when this run pushed
          # a generated commit. Its state says which commit to select without
          # trusting a pull request left open by an earlier attempt.
          merge_step=""
          for attempt in {1..60}; do
            merge_step="$(
              gh run view "$SYNC_RUN_ID" --repo thallylabs/starter --json jobs \
                --jq '[.jobs[]?.steps[]? | select(.name == "Merge after CI succeeds")][0] | if . == null then "" elif .status == "completed" then .conclusion elif .status == "in_progress" then "in_progress" else "" end'
            )" || merge_step=""
            [[ -n "$merge_step" ]] && break
            sleep 5
          done

          case "$merge_step" in
            skipped)
              starter_sha="$(gh api repos/thallylabs/starter/commits/main --jq .sha)"
              selection="starter main"
              ;;
            in_progress|success)
              # The generated commit is the head of this runtime's
              # synchronization branch and of its open pull request. Requiring
              # both to agree rejects a stale or lagging view of either. If
              # the run already merged and deleted the branch, the commit is
              # the new starter main.
              sync_branch="automation/runtime-${RUNTIME_SHA:0:12}"
              selection="pull request branch $sync_branch"
              starter_sha=""
              for attempt in {1..12}; do
                branch_sha="$(
                  gh api "repos/thallylabs/starter/git/ref/heads/$sync_branch" --jq .object.sha 2>/dev/null
                )" || branch_sha=""
                pr_head_sha="$(
                  gh api "repos/thallylabs/starter/pulls?state=open&base=main&head=thallylabs:$sync_branch" \
                    --jq '.[0].head.sha // ""'
                )" || pr_head_sha=""
                if [[ "$branch_sha" =~ ^[0-9a-f]{40}$ && "$branch_sha" == "$pr_head_sha" ]]; then
                  starter_sha="$branch_sha"
                  break
                fi
                if [[ -z "$branch_sha" && -z "$pr_head_sha" ]] && \
                   [[ "$(gh run view "$SYNC_RUN_ID" --repo thallylabs/starter --json conclusion --jq .conclusion)" == "success" ]]; then
                  starter_sha="$(gh api repos/thallylabs/starter/commits/main --jq .sha)"
                  selection="starter main after the synchronization merged"
                  break
                fi
                sleep 5
              done
              if [[ -z "$starter_sha" ]]; then
                echo "::error::The open starter synchronization pull request for $sync_branch could not be resolved."
                exit 1
              fi
              ;;
            *)
              echo "::error::Starter synchronization run $SYNC_RUN_ID did not report whether it changed the starter (merge step: ${merge_step:-unknown})."
              exit 1
              ;;
          esac

          pinned_runtime="$(
            gh api "repos/thallylabs/starter/contents/starter-release.json?ref=$starter_sha" --jq .content \
              | tr -d '\n' \
              | base64 --decode \
              | jq -r .runtime.commitSha
          )"
          if [[ "$pinned_runtime" != "$RUNTIME_SHA" ]]; then
            echo "::error::Starter commit $starter_sha ($selection) pins $pinned_runtime, not $RUNTIME_SHA."
            exit 1
          fi
          echo "Selected starter commit $starter_sha from $selection."
          echo "starter_sha=$starter_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether this pair is already stable
        id: stable
        shell: bash
        env:
          COORDINATOR_ACTOR: ${{ vars.RELEASE_COORDINATOR_ACTOR }}
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          LEGACY_RELEASE_ACTOR: ${{ vars.LEGACY_RELEASE_ACTOR }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          STARTER_SHA: ${{ steps.release.outputs.stable_starter_sha || steps.starter.outputs.starter_sha }}
        run: |
          set -euo pipefail
          record="$(
            gh api 'repos/thallylabs/thally/contents/packages/create-thally-docs/src/stable-scaffold-release.json?ref=main' --jq .content \
              | tr -d '\n' \
              | base64 --decode
          )"
          if [[ "$(jq -r .runtime.commitSha <<<"$record")" == "$RUNTIME_SHA" && \
                "$(jq -r .source.commitSha <<<"$record")" == "$STARTER_SHA" ]]; then
            release_id="$(jq -r .id <<<"$record")"
            record_sha=""
            while read -r candidate_sha; do
              candidate_id="$(
                gh api "repos/thallylabs/thally/contents/packages/create-thally-docs/src/stable-scaffold-release.json?ref=$candidate_sha" --jq .content \
                  | tr -d '\n' \
                  | base64 --decode \
                  | jq -r .id
              )"
              if [[ "$candidate_id" == "$release_id" ]]; then
                record_sha="$candidate_sha"
                break
              fi
            done < <(
              gh api \
                'repos/thallylabs/thally/commits?path=packages/create-thally-docs/src/stable-scaffold-release.json&sha=main&per_page=100' \
                --jq '.[].sha'
            )
            if [[ -z "$record_sha" ]]; then
              echo "::error::The stable release-record commit could not be resolved."
              exit 1
            fi
            expected_suffix=" · ${release_id} · ${record_sha}"
            cloud_complete="$(
              gh api \
                'repos/thallylabs/thally-cloud/actions/workflows/promote-scaffold-release.yml/runs?event=workflow_dispatch&per_page=100' \
                | jq -r \
                  --arg actor "$COORDINATOR_ACTOR" \
                  --arg suffix "$expected_suffix" \
                  '.workflow_runs[] | select(.display_title | startswith("scaffold-production · automated · handoff-") and endswith($suffix)) | select(.actor.login == $actor and .conclusion == "success") | .conclusion' \
                | head -n 1
            )"
            if [[ "$cloud_complete" != "success" && -n "$LEGACY_RELEASE_ACTOR" ]]; then
              # Pre-controller repository dispatches had no correlated title,
              # so compatibility requires both exact immutable locator fields
              # from a successful run by the allowlisted legacy publisher.
              while read -r legacy_run; do
                # GitHub deletes run logs after the retention period. A run
                # whose log is gone cannot prove this release, so it is
                # skipped and the release is re-driven instead.
                if ! legacy_log="$(
                  gh run view "$legacy_run" \
                    --repo thallylabs/thally-cloud \
                    --log 2>/dev/null
                )"; then
                  echo "::notice::Skipped legacy promotion run $legacy_run: its log is no longer available."
                  continue
                fi
                if grep -Fq "\"release_id\": \"$release_id\"" <<<"$legacy_log" && \
                   grep -Fq "\"record_commit_sha\": \"$record_sha\"" <<<"$legacy_log"; then
                  cloud_complete=success
                  break
                fi
              done < <(
                gh api \
                  'repos/thallylabs/thally-cloud/actions/workflows/promote-scaffold-release.yml/runs?event=repository_dispatch&status=success&per_page=100' \
                  | jq -r \
                    --arg actor "$LEGACY_RELEASE_ACTOR" \
                    '.workflow_runs[] | select(.actor.login == $actor) | .id'
              )
            fi
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "cloud_complete=$([[ "$cloud_complete" == "success" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "record_sha=$record_sha" >> "$GITHUB_OUTPUT"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the immutable release-record promotion
        if: steps.stable.outputs.needed == 'true'
        id: promotion
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          STARTER_SHA: ${{ steps.release.outputs.stable_starter_sha || steps.starter.outputs.starter_sha }}
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml \
            --repo thallylabs/thally \
            --ref main \
            -f runtime_sha="$RUNTIME_SHA" \
            -f starter_sha="$STARTER_SHA" \
            -f release_base_sha="$RUNTIME_SHA" \
            -f auto_merge=true \
            -f request_id="$REQUEST_ID"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list \
                --repo thallylabs/thally \
                --workflow promote-release.yml \
                --event workflow_dispatch \
                --limit 50 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle | contains(\"$REQUEST_ID\")) | .databaseId" \
                | head -n 1
            )" || run_id=""
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::The release promotion run did not start."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # The starter run was left in the background above. The blocking stage
      # cannot succeed unless it does, and the selected commit must be the one
      # that reached starter main.
      #
      # Each observation is retried with backoff and ends in one of three
      # answers: yes, definitely no, or unknown. The promotion is cancelled
      # only when the selected commit is definitely not going to reach starter
      # main. When GitHub cannot be read, nothing is cancelled: the promotion
      # may already be merging, and its own gate refuses to merge until the
      # commit is on starter main, so this job fails with what it actually
      # knows and leaves that gate to decide.
      - name: Require the starter synchronization to succeed
        if: steps.release.outputs.current_stable != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          PROMOTION_RUN_ID: ${{ steps.promotion.outputs.run_id }}
          STARTER_SHA: ${{ steps.starter.outputs.starter_sha }}
          SYNC_RUN_ID: ${{ steps.sync.outputs.run_id }}
        run: |
          set -euo pipefail
          # Prints the run's conclusion once it has completed, or nothing if
          # that could not be read. `gh run watch` only waits here; its exit
          # status is ignored because it also fails on a network error.
          starter_run_conclusion() {
            local delay=5 attempt conclusion
            for attempt in 1 2 3 4 5 6; do
              gh run watch "$SYNC_RUN_ID" --repo thallylabs/starter >&2 || true
              if conclusion="$(
                gh run view "$SYNC_RUN_ID" --repo thallylabs/starter \
                  --json status,conclusion \
                  --jq 'select(.status == "completed") | .conclusion'
              )" && [[ -n "$conclusion" ]]; then
                echo "$conclusion"
                return 0
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          # Prints landed, missing, or unknown. "ahead" or "identical" means
          # starter main contains the selection. "missing" needs two reads
          # that agree, so one stale answer just after a merge is not final.
          selected_commit_state() {
            local delay=5 attempt relation missing=0
            for attempt in 1 2 3 4 5 6; do
              if relation="$(
                gh api "repos/thallylabs/starter/compare/${STARTER_SHA}...main" --jq .status
              )"; then
                case "$relation" in
                  ahead|identical)
                    echo landed
                    return 0
                    ;;
                  behind|diverged)
                    missing=$((missing + 1))
                    if [[ "$missing" -ge 2 ]]; then
                      echo missing
                      return 0
                    fi
                    ;;
                esac
              fi
              sleep "$delay"
              delay=$((delay * 2))
            done
            echo unknown
          }
          stop_promotion() {
            if [[ -n "$PROMOTION_RUN_ID" ]]; then
              gh run cancel "$PROMOTION_RUN_ID" --repo thallylabs/thally ||
                echo "::warning::Could not cancel promotion run $PROMOTION_RUN_ID; its own gate still refuses to merge."
            fi
          }

          conclusion="$(starter_run_conclusion)"
          state="$(selected_commit_state)"
          echo "Starter synchronization run $SYNC_RUN_ID: ${conclusion:-not observed}; selected commit $STARTER_SHA: $state."

          if [[ "$conclusion" == "success" && "$state" == "landed" ]]; then
            exit 0
          fi
          case "${conclusion:-unobserved}/$state" in
            success/missing)
              echo "::error::Starter synchronization run $SYNC_RUN_ID succeeded, but starter main does not contain the selected commit $STARTER_SHA. The starter must advance main by fast-forward to the commit its CI verified; a squash merge creates a different commit. Deploy the fast-forward Sync Thally runtime workflow in thallylabs/starter, then run Full release again to bind the merged starter main. The release record was not merged."
              stop_promotion
              ;;
            success/unknown)
              echo "::error::Starter synchronization run $SYNC_RUN_ID succeeded, but GitHub could not confirm that starter main contains $STARTER_SHA. The promotion was left running; it merges the record only if that commit is on starter main. Check the promotion run, then run Full release again."
              ;;
            unobserved/landed)
              echo "::error::The result of starter synchronization run $SYNC_RUN_ID could not be read from GitHub, although its commit $STARTER_SHA is on starter main. The promotion was left running. Check both runs, then run Full release again."
              ;;
            unobserved/*)
              echo "::error::Neither the result of starter synchronization run $SYNC_RUN_ID nor the position of $STARTER_SHA on starter main could be confirmed. The promotion was left running; it merges the record only if that commit is on starter main. Check both runs, then run Full release again."
              ;;
            */landed)
              echo "::error::Starter synchronization run $SYNC_RUN_ID ended with \"$conclusion\" after its verified commit $STARTER_SHA reached starter main. The promotion was left running because the commit it binds is verified and merged. Inspect the starter run, then run Full release again."
              ;;
            */missing)
              echo "::error::Starter synchronization run $SYNC_RUN_ID ended with \"$conclusion\" and its commit $STARTER_SHA is not on starter main. The release record will not be merged."
              stop_promotion
              ;;
            *)
              echo "::error::Starter synchronization run $SYNC_RUN_ID ended with \"$conclusion\", and GitHub could not confirm whether $STARTER_SHA is on starter main. The promotion was cancelled; if it had already merged, run Full release again to finish that release."
              stop_promotion
              ;;
          esac
          exit 1

      - name: Wait for the merged release record
        if: steps.stable.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          PROMOTION_RUN_ID: ${{ steps.promotion.outputs.run_id }}
        run: |
          set -euo pipefail
          # Prints the run's conclusion once it has completed, or nothing if
          # GitHub could not be read for several consecutive attempts.
          # `gh run watch` only waits: it also exits non-zero on a transient
          # API error, so the conclusion is read separately and decides alone.
          run_conclusion() {
            local repo="$1" run="$2" failures=0 state
            while [[ "$failures" -lt 10 ]]; do
              gh run watch "$run" --repo "$repo" >&2 || true
              if state="$(
                gh run view "$run" --repo "$repo" --json status,conclusion --jq '"\(.status)/\(.conclusion)"'
              )"; then
                failures=0
                if [[ "$state" == completed/* ]]; then
                  echo "${state#completed/}"
                  return 0
                fi
              else
                failures=$((failures + 1))
              fi
              sleep 30
            done
            return 0
          }
          conclusion="$(run_conclusion thallylabs/thally "$PROMOTION_RUN_ID")"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Promotion run $PROMOTION_RUN_ID ended with \"${conclusion:-a result GitHub did not return}\". Inspect it, then run Full release again."
            exit 1
          fi

      - name: Resolve the published release record
        if: steps.stable.outputs.needed == 'true'
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          STARTER_SHA: ${{ steps.starter.outputs.starter_sha }}
        run: |
          set -euo pipefail
          record_sha=""
          record=""
          while read -r candidate_sha; do
            candidate_record="$(
              gh api "repos/thallylabs/thally/contents/packages/create-thally-docs/src/stable-scaffold-release.json?ref=$candidate_sha" --jq .content \
                | tr -d '\n' \
                | base64 --decode
            )"
            if [[ "$(jq -r .runtime.commitSha <<<"$candidate_record")" == "$RUNTIME_SHA" && \
                  "$(jq -r .source.commitSha <<<"$candidate_record")" == "$STARTER_SHA" ]]; then
              record_sha="$candidate_sha"
              record="$candidate_record"
              break
            fi
          done < <(
            gh api \
              'repos/thallylabs/thally/commits?path=packages/create-thally-docs/src/stable-scaffold-release.json&sha=main&per_page=100' \
              --jq '.[].sha'
          )
          if [[ -z "$record_sha" ]]; then
            echo "::error::The merged release-record commit could not be resolved."
            exit 1
          fi
          echo "record_sha=$record_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r .id <<<"$record")" >> "$GITHUB_OUTPUT"

      - name: Re-drive an interrupted stable release
        if: steps.stable.outputs.needed == 'false' && steps.stable.outputs.cloud_complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.coordinator.outputs.token }}
          RECORD_SHA: ${{ steps.stable.outputs.record_sha }}
          REQUEST_ID: ${{ steps.release.outputs.request_id }}
        run: |
          set -euo pipefail
          gh workflow run publish-packages.yml \
            --repo thallylabs/thally \
            --ref main \
            -f request_id="$REQUEST_ID" \
            -f release_commit_sha="$RECORD_SHA"

      - name: Resolve the active release
        if: steps.stable.outputs.needed == 'true' || steps.stable.outputs.cloud_complete != 'true'
        id: active-release
        shell: bash
        env:
          NEW_RECORD_SHA: ${{ steps.published.outputs.record_sha }}
          NEW_RELEASE_ID: ${{ steps.published.outputs.release_id }}
          EXISTING_RECORD_SHA: ${{ steps.stable.outputs.record_sha }}
          EXISTING_RELEASE_ID: ${{ steps.stable.outputs.release_id }}
        run: |
          set -euo pipefail
          record_sha="${NEW_RECORD_SHA:-$EXISTING_RECORD_SHA}"
          release_id="${NEW_RELEASE_ID:-$EXISTING_RELEASE_ID}"
          echo "record_sha=$record_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Write blocking-stage summary
        shell: bash
        env:
          CLOUD_COMPLETE: ${{ steps.stable.outputs.cloud_complete }}
          NEEDED: ${{ steps.stable.outputs.needed }}
          RECORD_SHA: ${{ steps.active-release.outputs.record_sha || steps.stable.outputs.record_sha }}
          RELEASE_ID: ${{ steps.active-release.outputs.release_id || steps.stable.outputs.release_id }}
          RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          STARTER_SHA: ${{ steps.release.outputs.stable_starter_sha || steps.starter.outputs.starter_sha }}
        run: |
          {
            echo "## Release record merged"
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Record commit: \`$RECORD_SHA\`"
            echo "- Runtime: \`$RUNTIME_SHA\`"
            echo "- Starter: \`$STARTER_SHA\`"
            if [[ "$NEEDED" == "true" ]]; then
              echo "- Status: the starter is synchronized and the release record is on \`main\`."
              echo "- Next: npm publication and Cloud promotion are continuing in the **Publish · Promote to Cloud** job of this run."
            elif [[ "$CLOUD_COMPLETE" == "true" ]]; then
              echo "- Status: this exact pair was already the stable release; nothing is left to do."
            else
              echo "- Status: this exact pair was already recorded; its interrupted publication was restarted."
              echo "- Next: npm publication and Cloud promotion are continuing in the **Publish · Promote to Cloud** job of this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The asynchronous tail. Nothing here changes a repository: it observes the
  # publication that the merged record started and fails this run if npm
  # verification or the Cloud promotion fails. To recover from a failure here,
  # dispatch Full release again; it detects the merged record and re-drives
  # only the interrupted publication.
  publication:
    name: Publish · Promote to Cloud
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The same main-restricted environment as the blocking stage. This job
    # mints its own read-only tokens; none is passed between jobs.
    environment: release-control
    steps:
      - name: Reject non-main dispatches
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Mint the publication observer token
        if: needs.release.outputs.needed == 'true' || needs.release.outputs.cloud_complete != 'true'
        id: publication-observer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_COORDINATOR_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_COORDINATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thally
          permission-actions: read
          permission-contents: read

      - name: Wait for npm publication
        if: needs.release.outputs.needed == 'true' || needs.release.outputs.cloud_complete != 'true'
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publication-observer.outputs.token }}
          IS_NEW_RELEASE: ${{ needs.release.outputs.needed }}
          RECORD_SHA: ${{ needs.release.outputs.record_sha }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          REQUEST_ID: ${{ needs.release.outputs.request_id }}
        run: |
          set -euo pipefail
          # Prints the run's conclusion once it has completed, or nothing if
          # GitHub could not be read for several consecutive attempts.
          # `gh run watch` only waits: it also exits non-zero on a transient
          # API error, so the conclusion is read separately and decides alone.
          run_conclusion() {
            local repo="$1" run="$2" failures=0 state
            while [[ "$failures" -lt 10 ]]; do
              gh run watch "$run" --repo "$repo" >&2 || true
              if state="$(
                gh run view "$run" --repo "$repo" --json status,conclusion --jq '"\(.status)/\(.conclusion)"'
              )"; then
                failures=0
                if [[ "$state" == completed/* ]]; then
                  echo "${state#completed/}"
                  return 0
                fi
              else
                failures=$((failures + 1))
              fi
              sleep 30
            done
            return 0
          }
          # A failed lookup counts as "not found yet" and is retried.
          publish_run=""
          for attempt in {1..120}; do
            if [[ "$IS_NEW_RELEASE" == "true" ]]; then
              publish_run="$(
                gh run list \
                  --repo thallylabs/thally \
                  --workflow publish-packages.yml \
                  --event push \
                  --limit 50 \
                  --json databaseId,headSha \
                  --jq ".[] | select(.headSha == \"$RECORD_SHA\") | .databaseId" \
                  | head -n 1
              )" || publish_run=""
            else
              publish_run="$(
                gh run list \
                  --repo thallylabs/thally \
                  --workflow publish-packages.yml \
                  --event workflow_dispatch \
                  --limit 50 \
                  --json databaseId,displayTitle \
                  --jq ".[] | select(.displayTitle | contains(\"$REQUEST_ID\")) | .databaseId" \
                  | head -n 1
              )" || publish_run=""
            fi
            [[ -n "$publish_run" ]] && break
            sleep 5
          done
          if [[ -z "$publish_run" ]]; then
            echo "::error::Package publication did not start for $RECORD_SHA."
            exit 1
          fi
          conclusion="$(run_conclusion thallylabs/thally "$publish_run")"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Package publication run $publish_run ended with \"${conclusion:-a result GitHub did not return}\". Inspect it, then run Full release again."
            exit 1
          fi
          publish_attempt=""
          for attempt in 1 2 3 4 5 6; do
            publish_attempt="$(
              gh api "repos/thallylabs/thally/actions/runs/$publish_run" --jq .run_attempt
            )" || publish_attempt=""
            [[ -n "$publish_attempt" ]] && break
            sleep 10
          done
          if [[ -z "$publish_attempt" ]]; then
            echo "::error::GitHub did not return the attempt number of publication run $publish_run. Run Full release again."
            exit 1
          fi
          handoff_id="handoff-${publish_run}-${publish_attempt}"
          echo "expected_cloud_title=scaffold-production · automated · ${handoff_id} · ${RELEASE_ID} · ${RECORD_SHA}" >> "$GITHUB_OUTPUT"

      # Installation tokens expire after one hour. Mint this observer only
      # after npm completes so a long baseline build retains a fresh token.
      - name: Mint the Cloud observer token
        if: needs.release.outputs.needed == 'true' || needs.release.outputs.cloud_complete != 'true'
        id: cloud-observer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_COORDINATOR_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_COORDINATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thally-cloud
          permission-actions: read
          permission-contents: read

      - name: Wait for exact Cloud production handoff
        if: needs.release.outputs.needed == 'true' || needs.release.outputs.cloud_complete != 'true'
        shell: bash
        env:
          COORDINATOR_ACTOR: ${{ vars.RELEASE_COORDINATOR_ACTOR }}
          EXPECTED_TITLE: ${{ steps.publication.outputs.expected_cloud_title }}
          GH_TOKEN: ${{ steps.cloud-observer.outputs.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Prints the run's conclusion once it has completed, or nothing if
          # GitHub could not be read for several consecutive attempts.
          # `gh run watch` only waits: it also exits non-zero on a transient
          # API error, so the conclusion is read separately and decides alone.
          run_conclusion() {
            local repo="$1" run="$2" failures=0 state
            while [[ "$failures" -lt 10 ]]; do
              gh run watch "$run" --repo "$repo" >&2 || true
              if state="$(
                gh run view "$run" --repo "$repo" --json status,conclusion --jq '"\(.status)/\(.conclusion)"'
              )"; then
                failures=0
                if [[ "$state" == completed/* ]]; then
                  echo "${state#completed/}"
                  return 0
                fi
              else
                failures=$((failures + 1))
              fi
              sleep 30
            done
            return 0
          }
          # A failed lookup counts as "not found yet" and is retried.
          cloud_run=""
          for attempt in {1..120}; do
            cloud_run="$(
              gh api \
                'repos/thallylabs/thally-cloud/actions/workflows/promote-scaffold-release.yml/runs?event=workflow_dispatch&per_page=100' \
                | jq -r \
                  --arg actor "$COORDINATOR_ACTOR" \
                  --arg title "$EXPECTED_TITLE" \
                  '.workflow_runs[] | select(.display_title == $title and .actor.login == $actor) | .id' \
                | head -n 1
            )" || cloud_run=""
            [[ -n "$cloud_run" ]] && break
            sleep 5
          done
          if [[ -z "$cloud_run" ]]; then
            echo "::error::Cloud scaffold promotion did not start for $RELEASE_ID."
            exit 1
          fi
          conclusion="$(run_conclusion thallylabs/thally-cloud "$cloud_run")"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::Cloud scaffold promotion run $cloud_run ended with \"${conclusion:-a result GitHub did not return}\". Inspect it in thally-cloud, then run Full release again."
            exit 1
          fi

      - name: Write release summary
        shell: bash
        env:
          EXISTING_CLOUD_COMPLETE: ${{ needs.release.outputs.cloud_complete }}
          EXISTING_RELEASE_ID: ${{ needs.release.outputs.existing_release_id }}
          NEW_RELEASE_ID: ${{ needs.release.outputs.new_release_id }}
          RUNTIME_SHA: ${{ needs.release.outputs.runtime_sha }}
          STARTER_SHA: ${{ needs.release.outputs.starter_sha }}
        run: |
          release_id="${NEW_RELEASE_ID:-$EXISTING_RELEASE_ID}"
          {
            echo "## Full release complete"
            echo
            echo "- Release: \`$release_id\`"
            echo "- Runtime: \`$RUNTIME_SHA\`"
            echo "- Starter: \`$STARTER_SHA\`"
            if [[ -n "$NEW_RELEASE_ID" ]]; then
              echo "- Result: packages verified and Cloud scaffold promoted"
            elif [[ "$EXISTING_CLOUD_COMPLETE" == "true" ]]; then
              echo "- Result: this exact pair was already the stable release"
            else
              echo "- Result: interrupted package/Cloud promotion recovered"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
